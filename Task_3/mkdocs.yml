site_name: Ibex Simulation Environment
site_url: https://the-fifth-semiconductor.github.io/Ibex-simulation-env/
site_description: Documentation for the Ibex-based SoC simulation environment
repo_url: https://github.com/The-Fifth-Semiconductor/Ibex-simulation-env
repo_name: The-Fifth-Semiconductor/Ibex-simulation-env
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.action.edit

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - SPI Host: spi.md
  - Debug Module: rv_dm.md
#mkdocs serve
