# Connect to simulation via jtagdpi TCP socket
  adapter driver remote_bitbang
  remote_bitbang host localhost
  remote_bitbang port 44853

  # RISC-V JTAG TAP (rv_dm uses 5-bit IR)
  set _CHIPNAME riscv
  jtag newtap $_CHIPNAME cpu -irlen 5

  # Create the RISC-V target
  target create $_CHIPNAME.cpu riscv -chain-position $_CHIPNAME.cpu

  riscv set_reset_timeout_sec 120
  riscv set_command_timeout_sec 120
  riscv set_prefer_sba on

  init
  halt
  echo "Ready for debugging"
